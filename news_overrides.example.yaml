# Copy to news_overrides.yaml. Claude fills this in from web-searched team news
# before each report run; it's an optional overlay — absent players fall back
# to the FPL API's own status/chance_of_playing fields and the stat-based
# role-shift detector in analysis/xpts.py.
#
# player_id: <FPL element id>
#
# Availability (injury/suspension/rotation doubt):
#   status: out | doubtful | available
#   chance_of_playing_override: 0-100, optional
#
# Tactical deployment (distinct from availability — this player IS playing,
# just differently than their FPL position suggests). This is the immediate,
# news-driven counterpart to the statistical role-shift detector: a manager
# quote or an observed tactical change is known the moment it happens, before
# enough games accumulate for the stats to confirm it on their own.
#
# Keep these two apart — they carry different weight and don't necessarily
# come together:
#   role_note / role_direction: a genuine change in WHERE a player lines up
#     for open play (e.g. "played as an auxiliary midfielder the full match").
#     This is the higher-value signal — more touches/shots/xG over 90 minutes,
#     likely to recur while the tactical setup holds.
#   set_piece_note: elevated threat on dead-ball situations specifically (e.g.
#     "targeted at the near post on corners"). This can exist independently of
#     open-play role — a center-back can be a corner threat without playing
#     any higher in open play — and it's a narrower signal: it only pays off
#     on the ~8-10 set pieces a game, not general run-of-play involvement.
#     Don't let a set-piece chance get folded into role_direction/attacking
#     output as if it were open-play involvement — that overstates the signal.
#
# note: short human-readable reason (used for any of the above)
# source: where this came from
#
# players:
#   328:
#     status: doubtful
#     chance_of_playing_override: 50
#     note: "Manager said 'assessing him daily' in Friday presser"
#     source: "https://example.com/press-conference"
#   455:
#     role_note: "Played as an auxiliary midfielder for the full match"
#     role_direction: more_attacking
#     set_piece_note: "Both chances created were from corners, not open play — treat as dead-ball threat, not confirmed elevated open-play involvement yet"
#     source: "https://example.com/match-report"
players: {}
