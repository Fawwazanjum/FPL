# Copy this file to config.yaml and fill in your team_id.
# config.yaml is gitignored — it's personal, not committed.

team_id: 0 # your FPL team ID, from the URL when viewing your team, e.g. fantasy.premierleague.com/entry/1234567/...

data_dir: ./data
reports_dir: ./reports

cache_ttl_hours:
  bootstrap_static: 6
  fixtures: 12
  element_summary: 24
  entry: 6
  understat: 48

form_weights:
  last_season_floor_weight: 0.15
  prior_decay_games: 8
  recent_vs_season_split_recent: 0.65
  recent_form_shrinkage_minutes: 400

xpts_horizon_gws: 5
xpts_horizon_decay: 0.75

differential_ownership_threshold: 10.0
differential_gamma: 1.5

optimizer:
  max_transfers_considered: 5
  hit_cost: 4
  candidate_pool_per_position: 40
  hit_margin_required: 2.0 # a hit must net at least this many more points than banking to be recommended

understat:
  enabled: true

chips:
  wildcard_gap_threshold: 15.0 # min horizon-pts gap (ideal squad vs banked) to even consider a wildcard
  min_games_for_wildcard_confidence: 3 # won't recommend a wildcard until this many real gameweeks have been played
  free_hit_blank_threshold: 4 # min starters with no fixture to suggest a free hit
  triple_captain_uplift_threshold: 4.0 # min extra pts a DGW captain pick needs over a normal week
  bench_boost_min_bench_value: 12.0 # min combined bench value to suggest a bench boost

# Optional: paste exact purchase prices from the FPL app ("My Team") if you
# want day-one precision instead of the tool's price-history estimate.
# purchase_price_overrides:
#   12345: 5.5

# Optional: a transfer you've made on the real FPL site for the upcoming
# deadline that the API hasn't surfaced yet (it only exposes locked-in picks
# and the transfers ledger AFTER a deadline passes, not live). Remove the
# entry once that gameweek's deadline has passed and rerun — the API will
# have caught up by then, and pending_transfers stops being needed for it.
# pending_transfers:
#   - player_out: 372
#     player_in: 86

news_overrides_path: ./news_overrides.yaml
log_level: INFO
